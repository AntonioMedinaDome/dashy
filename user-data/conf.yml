pageInfo:
  title: Central de Trabajo
  description: Panel de Control Ejecutivo
  navLinks:
    - title: GitHub
      path: https://github.com
appConfig:
  theme: parchment
  layout: auto
  iconSize: medium
  customStyles: |
    :root {
      --background: #f4f0f8 !important;
      --background-darker: #eae3f2 !important;
      --card-background: #ffffff !important;
      --card-color: #1a1a1a !important;
      --text-color: #111111 !important;
      --heading-color: #0f172a !important;
      --accent: #38a169 !important;
      --item-background: #fbf9fd !important;
      --item-hover-background: #e8f5e9 !important;
      --border-color: #dcd3e6 !important;
    }
    body {
      background-color: #f4f0f8 !important;
      color: #111111 !important;
    }
    .section-title {
      color: #111111 !important;
      border-bottom: 2px solid #81c784 !important;
    }
    .item-icon img, .item-icon svg {
      filter: none !important;
    }
