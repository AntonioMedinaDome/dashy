appConfig:
  theme: glass
  layout: masonry
  iconSize: small
  customStyles: |
    html, body, #app, #dashy, main {
      background-color: #f3eef8 !important;
      background-image: none !important;
      color: #1a1a1a !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
    }
    .page-title, .page-subtitle, h1, h2, h3, p, span, a {
      color: #1a1a1a !important;
    }
    .section, .col-item {
      background: #ffffff !important;
      border: 1px solid #dfd5ea !important;
      border-radius: 12px !important;
      box-shadow: 0 4px 12px rgba(120, 90, 150, 0.08) !important;
      overflow: hidden !important;
    }
    .section-header, .section-title, header {
      background-color: #e6dbf3 !important;
      color: #1a1a1a !important;
      border-bottom: 3px solid #66bb6a !important;
      padding: 8px 12px !important;
    }
    .section-title h2, .section-title span, .section-header * {
      color: #1a1a1a !important;
      font-weight: 700 !important;
    }
    .item, .item-container {
      background-color: #ffffff !important;
      border: 1px solid #eee8f5 !important;
      border-radius: 8px !important;
    }
    .item:hover {
      background-color: #e8f5e9 !important;
      border-color: #81c784 !important;
      transform: translateY(-2px);
    }
    .item-title, .item-description {
      color: #1a1a1a !important;
      font-weight: 600 !important;
    }
    .item-icon img, .item-icon svg {
      filter: none !important;
    }
  customCss: >-
    /* 1. Fondo de toda la pantalla: lila suave y claro */

    html, body, #app, #dashy, main, .page {
      background-color: #f2eefa !important;
      background-image: none !important;
    }


    /* 2. Bloques de categorías: todo el bloque uniforme con tono menta claro y
    bordes suaves (adiós azul) */

    .section, .col-item, .item-group {
      background-color: #eef7f2 !important;
      border: 2px solid #b7dfc8 !important;
      border-radius: 14px !important;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05) !important;
      padding: 12px !important;
    }


    /* 3. Títulos de cada categoría */

    .section-header, .section-title, header {
      background: transparent !important;
      border-bottom: 2px solid #b7dfc8 !important;
      padding-bottom: 8px !important;
      margin-bottom: 12px !important;
    }


    .section-title *, .section-header * {
      color: #1a2e22 !important;
      font-weight: 800 !important;
    }


    /* 4. Tarjetas individuales de cada botón dentro del cuadro: blanco limpio
    */

    .item, .item-container {
      background-color: #ffffff !important;
      border: 1px solid #d4ebd9 !important;
      border-radius: 10px !important;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03) !important;
    }


    .item:hover {
      background-color: #ffffff !important;
      border-color: #48bb78 !important;
      transform: translateY(-2px);
    }


    /* 5. Textos en negro nítido */

    .item-title, .item-description, h1, h2, h3, p, span, a {
      color: #111111 !important;
      font-weight: 600 !important;
    }


    /* 6. Iconos en su color original */

    .item-icon img, .item-icon svg {
      filter: none !important;
    }
  language: es
